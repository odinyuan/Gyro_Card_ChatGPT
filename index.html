<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Gyro Holographic Card</title>
  <style>
    :root {
      --card-rx: 0deg;
      --card-ry: 0deg;
      --view-x: 0px;
      --view-y: 0px;
      --light-x: 50%;
      --light-y: 50%;
      --foil-x: 50%;
      --foil-y: 50%;
      --shine: .55;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      background: radial-gradient(circle at 50% 18%, #262626 0%, #101010 40%, #050505 100%);
    }
    .stage {
      width: 100%; height: 100%; display: grid; place-items: center;
      perspective: 1400px; padding: 20px;
    }
    .wrap { width: min(80vw, 392px); aspect-ratio: 3 / 4; position: relative; }
    .card {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform: rotateX(var(--card-rx)) rotateY(var(--card-ry));
      transition: transform 50ms linear;
      filter: drop-shadow(0 32px 70px rgba(0,0,0,.55));
    }
    .clip {
      position: absolute; inset: 0; border-radius: 24px; overflow: hidden;
      transform-style: preserve-3d;
      background: #111;
      isolation: isolate;
    }

    .layer {
      position: absolute;
      inset: -5%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      will-change: transform;
      transform-origin: center center;
    }

    /* All layers are driven by the same view vector; only depth factors differ */
    .shadow {
      background-image: url('assets/shadow.png');
      transform: translate3d(calc(var(--view-x) * 0.22), calc(var(--view-y) * 0.22), -18px) scale(1.06);
      opacity: .34;
      filter: blur(5px);
    }
    .bg {
      background-image: url('assets/background.png');
      transform: translate3d(calc(var(--view-x) * -0.18), calc(var(--view-y) * -0.18), 0px) scale(1.10);
    }
    .mid {
      background-image: url('assets/card-full.png');
      transform: translate3d(calc(var(--view-x) * -0.05), calc(var(--view-y) * -0.05), 8px) scale(1.04);
      opacity: .18;
      mix-blend-mode: normal;
    }
    .creature {
      background-image: url('assets/creature.png');
      transform: translate3d(calc(var(--view-x) * 0.34), calc(var(--view-y) * 0.34), 26px) scale(1.10);
    }
    .frame {
      background-image: url('assets/frame.png');
      transform: translate3d(calc(var(--view-x) * 0.10), calc(var(--view-y) * 0.10), 40px) scale(1.05);
    }

    .foil-a, .foil-b, .glare, .sparkle, .edge {
      position: absolute; inset: 0; pointer-events: none; border-radius: 24px;
      will-change: transform, opacity, background-position;
    }
    .foil-a {
      inset: -18%;
      mix-blend-mode: color-dodge;
      opacity: var(--shine);
      background:
        linear-gradient(115deg,
          transparent 14%,
          rgba(255, 70, 130, .28) 26%,
          rgba(255, 214, 90, .34) 37%,
          rgba(100, 255, 215, .40) 48%,
          rgba(70, 175, 255, .44) 58%,
          rgba(180, 80, 255, .38) 68%,
          transparent 82%);
      background-size: 170% 170%;
      background-position: var(--foil-x) var(--foil-y);
      transform: translate3d(calc(var(--view-x) * 0.16), calc(var(--view-y) * 0.16), 30px) rotate(2deg);
      filter: saturate(1.25);
    }
    .foil-b {
      mix-blend-mode: soft-light;
      opacity: .42;
      background:
        radial-gradient(circle at calc(var(--light-x) * .8) calc(var(--light-y) * .8), rgba(255,255,255,.14), transparent 34%),
        conic-gradient(from 120deg at var(--light-x) var(--light-y),
          rgba(255, 0, 128, .14), rgba(255, 215, 0, .14), rgba(0,255,255,.13), rgba(110,110,255,.14), rgba(255,0,128,.14));
      transform: translate3d(calc(var(--view-x) * 0.10), calc(var(--view-y) * 0.10), 32px);
    }
    .glare {
      mix-blend-mode: screen;
      background: radial-gradient(circle at var(--light-x) var(--light-y), rgba(255,255,255,.96) 0%, rgba(255,255,255,.44) 8%, rgba(145,220,255,.20) 18%, rgba(255,255,255,0) 40%);
      opacity: .92;
      transform: translate3d(calc(var(--view-x) * 0.18), calc(var(--view-y) * 0.18), 36px);
    }
    .sparkle {
      mix-blend-mode: screen;
      opacity: .28;
      background-image:
        repeating-linear-gradient(35deg, rgba(255,255,255,.11) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(145deg, rgba(130,190,255,.09) 0 1px, transparent 1px 9px),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.20) 0 1px, transparent 1.6px),
        radial-gradient(circle at 70% 60%, rgba(255,230,140,.16) 0 1px, transparent 1.6px),
        radial-gradient(circle at 40% 80%, rgba(120,255,255,.16) 0 1px, transparent 1.6px);
      background-position:
        calc(var(--light-x) * .18) calc(var(--light-y) * .18),
        calc(var(--light-x) * -.12) calc(var(--light-y) * -.12),
        0 0, 0 0, 0 0;
      transform: translate3d(calc(var(--view-x) * 0.14), calc(var(--view-y) * 0.14), 34px);
    }
    .edge {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.34), inset 0 0 18px rgba(255,255,255,.08);
      transform: translateZ(44px);
    }

    .hud {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      padding: 10px 14px; border-radius: 999px;
      background: rgba(0,0,0,.56); backdrop-filter: blur(12px);
      color: rgba(255,255,255,.94); font-size: 13px; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }
    button {
      appearance: none; border: 0; padding: 10px 14px; border-radius: 999px;
      background: white; color: black; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="card" id="card">
        <div class="clip">
          <div class="layer shadow"></div>
          <div class="layer bg"></div>
          <div class="layer mid"></div>
          <div class="foil-a"></div>
          <div class="layer creature"></div>
          <div class="foil-b"></div>
          <div class="sparkle"></div>
          <div class="glare"></div>
          <div class="layer frame"></div>
          <div class="edge"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hud">
    <span id="status">点击启用陀螺仪</span>
    <button id="enable">Enable Gyro</button>
  </div>

  <script>
    const root = document.documentElement;
    const statusEl = document.getElementById('status');
    const enableBtn = document.getElementById('enable');

    const target = { beta: 45, gamma: 0 };
    const current = { beta: 45, gamma: 0 };

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function apply(beta, gamma) {
      const g = clamp(gamma, -32, 32);
      const b = clamp(beta - 45, -32, 32);

      // overall card tilt
      const ry = g * 0.46;
      const rx = -b * 0.36;

      // unified view vector for all inner layers
      const vx = (g * 0.85).toFixed(2) + 'px';
      const vy = (b * 0.78).toFixed(2) + 'px';

      // light / foil follows same orientation but exaggerated a little
      const lx = 50 + (g / 32) * 40;
      const ly = 50 + (b / 32) * 40;
      const fx = 50 + (g / 32) * 55;
      const fy = 50 + (b / 32) * 55;

      root.style.setProperty('--card-ry', ry.toFixed(2) + 'deg');
      root.style.setProperty('--card-rx', rx.toFixed(2) + 'deg');
      root.style.setProperty('--view-x', vx);
      root.style.setProperty('--view-y', vy);
      root.style.setProperty('--light-x', lx.toFixed(2) + '%');
      root.style.setProperty('--light-y', ly.toFixed(2) + '%');
      root.style.setProperty('--foil-x', fx.toFixed(2) + '%');
      root.style.setProperty('--foil-y', fy.toFixed(2) + '%');

      const intensity = 0.42 + Math.min(0.34, (Math.abs(g) + Math.abs(b)) / 120);
      root.style.setProperty('--shine', intensity.toFixed(2));

      statusEl.textContent = `β ${beta.toFixed(1)}°  γ ${gamma.toFixed(1)}°`;
    }

    function tick() {
      current.beta = lerp(current.beta, target.beta, 0.14);
      current.gamma = lerp(current.gamma, target.gamma, 0.14);
      apply(current.beta, current.gamma);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      target.beta = e.beta;
      target.gamma = e.gamma;
    }

    function startOrientation() {
      window.addEventListener('deviceorientation', onOrientation, true);
      statusEl.textContent = '陀螺仪已启用';
      enableBtn.style.display = 'none';
    }

    async function enableGyro() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') {
            statusEl.textContent = '未获得传感器权限';
            return;
          }
        }
        startOrientation();
      } catch (err) {
        console.error(err);
        statusEl.textContent = '无法启用传感器';
      }
    }
    enableBtn.addEventListener('click', enableGyro);

    function pointerFallback(clientX, clientY) {
      const nx = (clientX / innerWidth - 0.5) * 2;
      const ny = (clientY / innerHeight - 0.5) * 2;
      target.gamma = nx * 26;
      target.beta = 45 + ny * 26;
    }

    window.addEventListener('mousemove', e => pointerFallback(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (t) pointerFallback(t.clientX, t.clientY);
    }, { passive: true });
  </script>
</body>
</html>
